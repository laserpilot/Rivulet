<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivulet</title>
    <style>
        body {
            margin: 0;
            padding: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            overflow: hidden;
            font-size: 12px;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            margin: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 14px;
            margin: 0;
            font-weight: 600;
        }

        .status-badge {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .config-section {
            width: 100%;
            max-width: 100%;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
            overflow: hidden;
        }

        .section-title {
            font-size: 11px;
            margin-bottom: 6px;
            color: #7fb3d3;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: end;
            flex-wrap: wrap;
        }

        .input-field {
            flex: 1;
        }

        .input-field.size-input {
            max-width: 70px;
            flex: none;
            margin-right: 8px;
        }
        
        .input-field.size-input:last-child {
            margin-right: 0;
        }

        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
            font-size: 10px;
        }

        input, select {
            width: 100%;
            padding: 4px 6px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 3px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #7fb3d3;
            background: rgba(255,255,255,0.15);
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .preset-buttons {
            display: flex;
            gap: 3px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 2px 6px;
            font-size: 9px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 3px;
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            min-width: auto;
        }

        .preset-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .floating-element {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
        }

        .workflow-section {
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .workflow-steps {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .workflow-step {
            flex: 1;
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .workflow-step.active {
            border-color: #4CAF50;
            background: rgba(76,175,80,0.2);
        }

        .step-number {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .step-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .step-description {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .main-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 4px 8px;
            font-size: 10px;
            border: none;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 500;
            min-width: 60px;
            max-width: 140px;
            font-family: inherit;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        button:hover:not(:disabled) {
            background: rgba(255,255,255,0.25);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .primary-btn {
            background: #4CAF50;
        }

        .secondary-btn {
            background: #2196F3;
        }

        .danger-btn {
            background: #f44336;
        }

        .controls-row {
            display: flex;
            gap: 4px;
            justify-content: flex-start;
            margin-bottom: 4px;
            flex-wrap: wrap;
            max-width: 100%;
        }

        .status {
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 3px;
            font-size: 9px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 4px;
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }

        .status-active {
            background: #4CAF50;
        }

        .status-inactive {
            background: #f44336;
        }

        .stats {
            font-size: 9px;
            color: #7fb3d3;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Compact Header -->
        <div class="header">
            <h1>Rivulet</h1>
            <div class="status-badge">Professional Video Streaming • Ready</div>
        </div>
        
        <!-- Status Display -->
        <div class="status">
            <span class="status-indicator status-inactive"></span>
            <span id="statusText">Ready</span>
        </div>
        <div class="status">
            <span id="statsText" class="stats">Frames: 0 | FPS: 0</span>
        </div>
        
        <!-- Compact Configuration -->
        <div class="config-section">
            <div class="section-title">Window Size</div>
            <div class="input-row">
                <div class="input-field size-input">
                    <label for="windowWidth">Width</label>
                    <input type="number" id="windowWidth" value="1920" min="800" max="3840">
                </div>
                <div class="input-field size-input">
                    <label for="windowHeight">Height</label>
                    <input type="number" id="windowHeight" value="1080" min="600" max="2160">
                </div>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setSize(1920, 1080)">1080p</button>
                    <button class="preset-btn" onclick="setSize(1280, 720)">720p</button>
                    <button class="preset-btn" onclick="setSize(1024, 768)">4:3</button>
                </div>
            </div>
        </div>
        
        <div class="config-section">
            <div class="section-title">Website URL</div>
            <div class="input-group">
                <input type="url" id="contentUrl" value="https://p5js.org" placeholder="https://p5js.org">
            </div>
            <div class="controls-row" style="margin-top: 8px;">
                <button id="reloadContentBtn" class="secondary-btn" onclick="reloadWebContent()" disabled>
                    Reload Content
                </button>
            </div>
        </div>
        
        <!-- Streaming Controls -->
        <div class="config-section">
            <div class="section-title">Streaming Controls</div>
            <div class="controls-row">
                <button id="createWindowBtn" class="primary-btn" onclick="console.log('Button clicked!'); initializeAndCreateWindow();">
                    Create Window
                </button>
                <button id="startStreamingBtn" class="primary-btn" onclick="startWebContentStreaming()" disabled>
                    Start Stream
                </button>
                <button id="stopBtn" class="danger-btn" onclick="stopCapture()" disabled>
                    Stop Stream
                </button>
            </div>
        </div>
        
        
        <!-- Window Management -->
        <div class="config-section">
            <div class="section-title">Window Management</div>
            <div class="controls-row">
                <button id="toggleContentDecorationsBtn" class="secondary-btn" onclick="toggleContentWindowDecorations()">
                    Toggle Content Title Bar
                </button>
                <button id="closeContentWindowBtn" class="danger-btn" onclick="closeContentWindow()" disabled>
                    Close Window
                </button>
            </div>
        </div>
        
        
        <!-- System -->
        <div class="config-section">
            <div class="section-title">System</div>
            <div class="controls-row">
                <button id="refreshStateBtn" class="secondary-btn" onclick="refreshApplicationState()" title="Synchronizes the frontend interface with the current backend state">
                    Refresh State
                </button>
            </div>
        </div>
        
    </div>

    <script>
// Zero-Copy ScreenCaptureKit Frontend for Ultimate Performance
console.log('🚀 Loading Zero-Copy Syphon Frontend...');

// Wait for Tauri to be available
let invoke;

function initializeTauri() {
    if (window.__TAURI__ && window.__TAURI__.tauri) {
        invoke = window.__TAURI__.tauri.invoke;
        console.log('✅ Tauri API initialized');
        return true;
    }
    return false;
}

// Try to initialize immediately, or wait for Tauri
if (!initializeTauri()) {
    console.log('⏳ Waiting for Tauri API...');
    // Check periodically until Tauri is available
    const checkTauri = setInterval(() => {
        if (initializeTauri()) {
            clearInterval(checkTauri);
        }
    }, 100);
}

// Application state
let isInitialized = false;
let isCapturing = false;
let frameCount = 0;
let captureMode = 'Professional Web Streaming';
let currentStep = 1;

// Performance monitoring
let lastFpsTime = Date.now();
let fpsFrameCount = 0;
let currentFps = 0;
let processingTimer = null;

// Initialize when page loads
document.addEventListener('DOMContentLoaded', () => {
    console.log('🎯 Professional Web Streaming Frontend initialized');
    updateStatus('Ready to configure and stream web content', false);
    
    // Debug initial state
    console.log('🔍 DEBUG - Initial state:', {
        isInitialized,
        currentStep,
        isCapturing
    });
    
    updateUI();
    updateWorkflowSteps();
    validateInputs();
    
    // Check button state after UI update
    const btn = document.getElementById('createWindowBtn');
    console.log('🔍 DEBUG - Button after initialization:', {
        exists: !!btn,
        disabled: btn?.disabled,
        innerHTML: btn?.innerHTML
    });
    
    // Add additional event listener as test
    if (btn) {
        btn.addEventListener('click', (e) => {
            console.log('🔍 DEBUG - addEventListener click fired!', {
                disabled: btn.disabled,
                defaultPrevented: e.defaultPrevented
            });
        });
    }
});

// Input validation and helpers
function validateInputs() {
    const widthInput = document.getElementById('windowWidth');
    const heightInput = document.getElementById('windowHeight');
    const urlInput = document.getElementById('contentUrl');
    
    [widthInput, heightInput, urlInput].forEach(input => {
        if (input) {
            input.addEventListener('input', updateUI);
        }
    });
}

function setSize(width, height) {
    document.getElementById('windowWidth').value = width;
    document.getElementById('windowHeight').value = height;
    updateUI();
}

function setUrl(url) {
    document.getElementById('contentUrl').value = url;
    updateUI();
}

function updateWorkflowSteps() {
    // Workflow steps removed for compact design
}

// Combined initialize and create window function
async function initializeAndCreateWindow() {
    console.log('🚀 FUNCTION CALLED: initializeAndCreateWindow');
    console.log('🔧 Initializing Syphon and creating window...');
    
    // Check if Tauri API is available
    if (!invoke) {
        console.error('❌ Tauri API not available. Cannot proceed.');
        updateStatus('❌ Application not ready. Please wait and try again.', false);
        return;
    }
    
    updateStatus('Initializing Syphon server...', false);
    
    try {
        // First initialize the video sharing
        const initResponse = await invoke('initialize_video_sharing');
        console.log('✅ Syphon server initialized:', initResponse);
        
        isInitialized = true;
        currentStep = 2;
        updateWorkflowSteps();
        updateUI();
        
        updateStatus('Creating content window...', false);
        
        // Then create the content window (inline to avoid the isInitialized check)
        const width = parseInt(document.getElementById('windowWidth').value) || 1920;
        const height = parseInt(document.getElementById('windowHeight').value) || 1080;
        let url = document.getElementById('contentUrl').value || 'https://p5js.org';
        
        // Auto-add protocol if missing
        if (!url.match(/^https?:\/\//)) {
            if (url.startsWith('www.') || url.includes('.')) {
                url = 'https://' + url;
                document.getElementById('contentUrl').value = url;
            } else {
                updateStatus('⚠️ Please enter a valid URL', false);
                return;
            }
        }
        
        console.log(`🌐 Creating content window: ${width}x${height} → ${url}`);
        updateStatus(`Creating ${width}x${height} content window...`, false);
        
        const response = await invoke('create_content_window_dynamic', {
            width: width,
            height: height,
            url: url
        });
        console.log('🌐 Content window response:', response);
        
        if (response.success) {
            console.log(`🔄 Setting content URL: ${url}`);
            
            // Add a small delay to ensure the content window is fully loaded
            setTimeout(async () => {
                try {
                    const urlResponse = await invoke('update_content_url', { url: url });
                    console.log('📡 URL update response:', urlResponse);
                    
                    if (urlResponse.success) {
                        currentStep = 3;
                        updateWorkflowSteps();
                        updateStatus(`✅ Window ${width}×${height} ready for streaming`, true);
                        updateUI();
                        
                        console.log('🎉 Content window SUCCESS: Ready for Syphon capture');
                    } else {
                        updateStatus(`⚠️ Failed to set URL: ${urlResponse.message}`, false);
                        console.error('❌ URL update failed:', urlResponse.message);
                    }
                } catch (urlError) {
                    console.error('❌ URL update error:', urlError);
                    updateStatus(`❌ URL update error: ${urlError}`, false);
                }
            }, 1000);
        } else {
            updateStatus(`⚠️ Failed to create content window: ${response.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Failed to initialize and create window:', error);
        updateStatus(`Error: ${error}`, false);
    }
}

// Initialize Syphon server (kept for backward compatibility)
async function initializeVideoSharing() {
    console.log('🔧 Initializing Syphon server...');
    updateStatus('Initializing Syphon server...', false);
    
    try {
        const response = await invoke('initialize_video_sharing');
        console.log('✅ Syphon server initialized:', response);
        
        isInitialized = true;
        currentStep = 2;
        updateWorkflowSteps();
        updateStatus('✅ Syphon ready', true);
        updateUI();
        
    } catch (error) {
        console.error('❌ Failed to initialize Syphon server:', error);
        updateStatus(`Error: ${error}`, false);
    }
}


// Start performance monitoring (background thread handles the actual publishing)
function startPerformanceMonitoring() {
    if (processingTimer) {
        clearInterval(processingTimer);
    }
    
    console.log('📊 Starting performance monitoring...');
    
    // Monitor performance stats every 500ms (less frequent since capture is automatic)
    processingTimer = setInterval(async () => {
        if (!isCapturing) {
            stopPerformanceMonitoring();
            return;
        }
        
        try {
            const response = await invoke('get_video_status');
            
            if (response.success && response.frame_count > frameCount) {
                frameCount = response.frame_count;
                updatePerformanceStats();
            }
            
        } catch (error) {
            console.error('❌ Performance monitoring error:', error);
            // Don't stop on single errors, just log them
        }
    }, 500); // Monitor every 500ms
}

// Stop performance monitoring
function stopPerformanceMonitoring() {
    if (processingTimer) {
        clearInterval(processingTimer);
        processingTimer = null;
        console.log('📊 Performance monitoring stopped');
    }
}

// Automatic processing state
let automaticProcessing = false;
let automaticTimer = null;

// Start automatic frame processing (integrated into streaming)
async function startAutomaticProcessing() {
    if (automaticProcessing) {
        console.log('⚠️ Automatic processing already active');
        return;
    }
    
    automaticProcessing = true;
    console.log('🎬 Starting automatic frame processing...');
    
    // Process frames at ~30 FPS (33ms intervals)
    automaticTimer = setInterval(async () => {
        if (!automaticProcessing || !isCapturing) {
            return;
        }
        
        try {
            const response = await invoke('process_frames');
            if (response.success && response.frame_count > frameCount) {
                frameCount = response.frame_count;
                updatePerformanceStats();
            }
        } catch (error) {
            console.error('❌ Automatic processing error:', error);
            // Don't stop on single errors, just log them
        }
    }, 33); // ~30 FPS
    
    console.log('🎬 Automatic frame processing started');
}

// Stop automatic frame processing
function stopAutomaticProcessing() {
    automaticProcessing = false;
    
    if (automaticTimer) {
        clearInterval(automaticTimer);
        automaticTimer = null;
        console.log('🛑 Automatic frame processing stopped');
    }
}

// DEBUG: Manual test function you can call from console
function testCreateWindow() {
    console.log('🧪 TEST: Manual button test called');
    const btn = document.getElementById('createWindowBtn');
    console.log('🧪 TEST: Button state:', {
        exists: !!btn,
        disabled: btn?.disabled,
        onclick: btn?.onclick
    });
    
    if (btn && !btn.disabled) {
        console.log('🧪 TEST: Calling initializeAndCreateWindow directly');
        initializeAndCreateWindow();
    } else {
        console.log('🧪 TEST: Button is disabled or missing');
    }
}

// Stop capture
async function stopCapture() {
    console.log('🛑 Stopping streaming...');
    updateStatus('Stopping streaming...', false);
    
    try {
        const response = await invoke('stop_screen_capture');
        console.log('✅ Streaming stopped:', response);
        
        isCapturing = false;
        captureMode = 'Professional Web Streaming';
        currentStep = 2; // Back to step 2
        updateWorkflowSteps();
        updateStatus('Stopped - ready for new content', false);
        updateUI();
        
        stopPerformanceMonitoring();
        stopAutomaticProcessing();
        
    } catch (error) {
        console.error('❌ Failed to stop streaming:', error);
        updateStatus(`Stop error: ${error}`, false);
    }
}


// Create content window with custom size and URL
async function createContentWindow() {
    if (!isInitialized) {
        updateStatus('Please initialize Syphon server first', false);
        return;
    }

    // Get configuration values
    const width = parseInt(document.getElementById('windowWidth').value) || 1920;
    const height = parseInt(document.getElementById('windowHeight').value) || 1080;
    let url = document.getElementById('contentUrl').value || 'https://p5js.org';
    
    // Auto-add protocol if missing
    if (!url.match(/^https?:\/\//)) {
        if (url.startsWith('www.') || url.includes('.')) {
            url = 'https://' + url;
            document.getElementById('contentUrl').value = url;
        } else {
            updateStatus('⚠️ Please enter a valid URL', false);
            return;
        }
    }
    
    console.log(`🌐 Creating content window: ${width}x${height} → ${url}`);
    updateStatus(`Creating ${width}x${height} content window...`, false);
    
    try {
        const response = await invoke('create_content_window_dynamic', {
            width: width,
            height: height,
            url: url
        });
        console.log('🌐 Content window response:', response);
        
        if (response.success) {
            // Step 2: Update the content window URL
            console.log(`🔄 Setting content URL: ${url}`);
            
            // Add a small delay to ensure the content window is fully loaded
            setTimeout(async () => {
                const urlResponse = await invoke('update_content_url', { url: url });
                console.log('📡 URL update response:', urlResponse);
                
                if (urlResponse.success) {
                    currentStep = 3;
                    updateWorkflowSteps();
                    updateStatus(`✅ Window ${width}×${height} ready`, true);
                    updateUI();
                    
                    console.log('🎉 Content window SUCCESS: Ready for Syphon capture');
                } else {
                    updateStatus(`⚠️ Failed to set URL: ${urlResponse.message}`, false);
                    console.error('❌ URL update failed:', urlResponse.message);
                }
            }, 1000); // Wait 1 second for content window to fully initialize
        } else {
            updateStatus(`⚠️ Failed to create content window: ${response.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Content window creation failed:', error);
        updateStatus(`Content window error: ${error}`, false);
    }
}

// Start Syphon capture of the content window
async function startWebContentStreaming() {
    if (!isInitialized) {
        updateStatus('Please initialize Syphon server first', false);
        return;
    }

    const url = document.getElementById('contentUrl').value;
    console.log(`🎯 Starting web content streaming: ${url}`);
    updateStatus('Starting Syphon capture of content window...', false);
    
    try {
        // Start content window specific streaming
        const captureResponse = await invoke('start_content_window_streaming');
        console.log('🎯 Content window streaming response:', captureResponse);
        
        if (captureResponse.success) {
            // Update capture state
            isCapturing = true;
            captureMode = 'Professional Web Content Streaming';
            updateStatus(`✅ Streaming ${url.split('://')[1]?.split('/')[0]}`, true);
            updateUI();
            
            // Start automatic frame processing and performance monitoring
            startPerformanceMonitoring();
            startAutomaticProcessing();
            
            console.log('🎉 STREAMING SUCCESS: Web content is now live via Syphon!');
            
        } else {
            updateStatus(`⚠️ Streaming failed: ${captureResponse.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Web content streaming failed:', error);
        updateStatus(`Streaming error: ${error}`, false);
    }
}

// Update performance statistics
function updatePerformanceStats() {
    const now = Date.now();
    fpsFrameCount++;
    
    if (now - lastFpsTime >= 1000) { // Update FPS every second
        currentFps = Math.round(fpsFrameCount * 1000 / (now - lastFpsTime));
        fpsFrameCount = 0;
        lastFpsTime = now;
        
        const statsText = document.getElementById('statsText');
        if (statsText) {
            statsText.textContent = `Frames: ${frameCount} | FPS: ${currentFps} | Mode: ${captureMode}`;
        }
    }
}

// Update UI button states
function updateUI() {
    const createWindowBtn = document.getElementById('createWindowBtn');
    const startStreamingBtn = document.getElementById('startStreamingBtn');
    const stopBtn = document.getElementById('stopBtn');
    const toggleContentDecorationsBtn = document.getElementById('toggleContentDecorationsBtn');
    const closeContentWindowBtn = document.getElementById('closeContentWindowBtn');
    const refreshStateBtn = document.getElementById('refreshStateBtn');
    const reloadContentBtn = document.getElementById('reloadContentBtn');
    
    // Validate inputs
    const width = parseInt(document.getElementById('windowWidth').value);
    const height = parseInt(document.getElementById('windowHeight').value);
    const url = document.getElementById('contentUrl').value;
    
    console.log('🔍 DEBUG - Validation values:', { width, height, url });
    console.log('🔍 DEBUG - Width valid:', width >= 800 && width <= 3840);
    console.log('🔍 DEBUG - Height valid:', height >= 600 && height <= 2160);
    console.log('🔍 DEBUG - URL valid:', (url.match(/^https?:\/\//) || url.includes('.')));
    
    const validInputs = width >= 800 && width <= 3840 && height >= 600 && height <= 2160 && (url.match(/^https?:\/\//) || url.includes('.'));
    console.log('🔍 DEBUG - validInputs:', validInputs);
    
    // Content window exists when we're at step 3 or currently streaming
    const contentWindowExists = currentStep >= 3 || isCapturing;
    
    if (createWindowBtn) {
        const shouldDisable = (isInitialized && currentStep >= 3) || !validInputs || isCapturing;
        console.log('🔍 DEBUG - Button disable logic:', {
            isInitialized,
            currentStep,
            validInputs,
            isCapturing,
            shouldDisable
        });
        createWindowBtn.disabled = shouldDisable;
    }
    if (startStreamingBtn) startStreamingBtn.disabled = !isInitialized || isCapturing || currentStep < 3;
    if (stopBtn) stopBtn.disabled = !isCapturing;
    
    // Content window controls - enabled when content window exists
    if (toggleContentDecorationsBtn) toggleContentDecorationsBtn.disabled = !contentWindowExists;
    if (closeContentWindowBtn) closeContentWindowBtn.disabled = !contentWindowExists;
    if (reloadContentBtn) reloadContentBtn.disabled = !contentWindowExists;
    
    
    // Update button text based on state
    if (createWindowBtn && !createWindowBtn.disabled) {
        const width = document.getElementById('windowWidth').value;
        const height = document.getElementById('windowHeight').value;
        createWindowBtn.innerHTML = `Create ${width}×${height} Window`;
    }
}

// Update status display
function updateStatus(message, active) {
    const indicator = document.querySelector('.status-indicator');
    const statusText = document.getElementById('statusText');
    
    if (indicator) {
        indicator.className = `status-indicator ${active ? 'status-active' : 'status-inactive'}`;
    }
    
    if (statusText) {
        statusText.textContent = message;
    }
    
    console.log(`Status: ${message} (${active ? 'active' : 'inactive'})`);
}

// Toggle content window decorations (title bar) - only affects content window
async function toggleContentWindowDecorations() {
    console.log('🎨 Toggling content window decorations...');
    updateStatus('Toggling content window title bar...', false);
    
    if (currentStep < 3) {
        updateStatus('⚠️ Please create a content window first', false);
        return;
    }
    
    try {
        const response = await invoke('toggle_content_window_decorations');
        console.log('🎨 Toggle content decorations response:', response);
        
        if (response.success) {
            updateStatus(`✅ ${response.message}`, true);
        } else {
            updateStatus(`⚠️ ${response.message}`, false);
        }
    } catch (error) {
        console.error('Toggle content decorations error:', error);
        updateStatus(`❌ Failed to toggle content decorations: ${error}`, false);
    }
}




// NEW: Close content window with proper cleanup
async function closeContentWindow() {
    console.log('🔒 Closing content window...');
    updateStatus('Closing content window...', false);
    
    try {
        // First stop any active streaming
        if (isCapturing) {
            await stopCapture();
        }
        
        // Close the content window
        const response = await invoke('close_content_window');
        console.log('🔒 Close content window response:', response);
        
        if (response.success) {
            // Reset state to step 2 (after initialization)
            currentStep = 2;
            updateWorkflowSteps();
            updateStatus('✅ Content window closed', true);
            updateUI();
            
            console.log('🔒 Content window closed successfully');
        } else {
            updateStatus(`⚠️ Failed to close content window: ${response.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Close content window failed:', error);
        updateStatus(`❌ Failed to close content window: ${error}`, false);
    }
}

// NEW: Refresh application state to sync frontend with backend
async function refreshApplicationState() {
    console.log('🔄 Refreshing application state...');
    updateStatus('Refreshing application state...', false);
    
    try {
        const response = await invoke('get_application_state');
        console.log('🔄 Application state response:', response);
        
        if (response.success) {
            // Update frontend state based on backend state
            isInitialized = response.state.initialized || false;
            isCapturing = response.state.capturing || false;
            
            // Determine current step based on state
            if (!isInitialized) {
                currentStep = 1;
            } else if (!response.state.content_window_exists) {
                currentStep = 2;
            } else if (!isCapturing) {
                currentStep = 3;
            } else {
                currentStep = 4;
            }
            
            updateWorkflowSteps();
            updateStatus('✅ Application state refreshed', true);
            updateUI();
            
            // Update performance monitoring if capturing
            if (isCapturing && !processingTimer) {
                startPerformanceMonitoring();
                startAutomaticProcessing();
            } else if (!isCapturing && processingTimer) {
                stopPerformanceMonitoring();
                stopAutomaticProcessing();
            }
            
            console.log('🔄 Application state synchronized');
        } else {
            updateStatus(`⚠️ Failed to refresh state: ${response.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Refresh application state failed:', error);
        updateStatus(`❌ Failed to refresh state: ${error}`, false);
    }
}

// NEW: Reload web content in existing content window with new URL
async function reloadWebContent() {
    console.log('🔄 Reloading web content with new URL...');
    
    // Check if Tauri API is available
    if (!invoke) {
        console.error('❌ Tauri API not available. Cannot proceed.');
        updateStatus('❌ Application not ready. Please wait and try again.', false);
        return;
    }
    
    // Get the current URL from the input field
    let url = document.getElementById('contentUrl').value || 'https://p5js.org';
    
    // Auto-add protocol if missing
    if (!url.match(/^https?:\/\//)) {
        if (url.startsWith('www.') || url.includes('.')) {
            url = 'https://' + url;
            document.getElementById('contentUrl').value = url;
        } else {
            updateStatus('⚠️ Please enter a valid URL', false);
            return;
        }
    }
    
    updateStatus(`Updating content to ${url}...`, false);
    
    try {
        // First update the URL
        const urlResponse = await invoke('update_content_url', { url: url });
        console.log('🔄 Update URL response:', urlResponse);
        
        if (urlResponse.success) {
            updateStatus('✅ Web content updated to new URL', true);
            console.log(`🔄 Web content updated to: ${url}`);
        } else {
            updateStatus(`⚠️ Failed to update URL: ${urlResponse.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Failed to update content URL:', error);
        updateStatus(`❌ Failed to update content: ${error}`, false);
    }
}
