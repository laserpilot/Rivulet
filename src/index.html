<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Web Content Streaming</title>
    <style>
        body {
            margin: 0;
            padding: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            overflow: hidden;
            font-size: 12px;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            margin: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 14px;
            margin: 0;
            font-weight: 600;
        }

        .status-badge {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .config-section {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .section-title {
            font-size: 11px;
            margin-bottom: 6px;
            color: #7fb3d3;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 6px;
            align-items: end;
        }

        .input-field {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
            font-size: 10px;
        }

        input, select {
            width: 100%;
            padding: 4px 6px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 3px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #7fb3d3;
            background: rgba(255,255,255,0.15);
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .preset-buttons {
            display: flex;
            gap: 3px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 2px 6px;
            font-size: 9px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 3px;
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            min-width: auto;
        }

        .preset-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .floating-element {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
        }

        .workflow-section {
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .workflow-steps {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .workflow-step {
            flex: 1;
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .workflow-step.active {
            border-color: #4CAF50;
            background: rgba(76,175,80,0.2);
        }

        .step-number {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .step-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .step-description {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .main-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 4px 8px;
            font-size: 10px;
            border: none;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 500;
            min-width: 60px;
            font-family: inherit;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            background: rgba(255,255,255,0.25);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .primary-btn {
            background: #4CAF50;
        }

        .secondary-btn {
            background: #2196F3;
        }

        .danger-btn {
            background: #f44336;
        }

        .controls-row {
            display: flex;
            gap: 4px;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .status {
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 3px;
            font-size: 9px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 4px;
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }

        .status-active {
            background: #4CAF50;
        }

        .status-inactive {
            background: #f44336;
        }

        .stats {
            font-size: 9px;
            color: #7fb3d3;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Compact Header -->
        <div class="header">
            <h1>🌐 Tauri Video Share</h1>
            <div class="status-badge">Syphon • Zero-Copy • Ready</div>
        </div>
        
        <!-- Compact Configuration -->
        <div class="config-section">
            <div class="section-title">Window Size</div>
            <div class="input-row">
                <div class="input-field">
                    <label for="windowWidth">W</label>
                    <input type="number" id="windowWidth" value="1920" min="800" max="3840">
                </div>
                <div class="input-field">
                    <label for="windowHeight">H</label>
                    <input type="number" id="windowHeight" value="1080" min="600" max="2160">
                </div>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setSize(1920, 1080)">1080p</button>
                    <button class="preset-btn" onclick="setSize(1280, 720)">720p</button>
                    <button class="preset-btn" onclick="setSize(1024, 768)">4:3</button>
                </div>
            </div>
        </div>
        
        <div class="config-section">
            <div class="section-title">Website URL</div>
            <div class="input-group">
                <input type="url" id="contentUrl" value="https://example.com" placeholder="https://example.com">
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setUrl('https://example.com')">Example</button>
                    <button class="preset-btn" onclick="setUrl('https://httpbin.org')">HTTPBin</button>
                    <button class="preset-btn" onclick="setUrl('https://www.ablairneal.com')">Sample</button>
                </div>
            </div>
        </div>
        
        <!-- Main Controls -->
        <div class="controls-row">
            <button id="initBtn" class="primary-btn" onclick="initializeVideoSharing()">
                Init
            </button>
            <button id="createContentWindowBtn" class="secondary-btn" onclick="createContentWindow()" disabled>
                Create
            </button>
            <button id="startStreamingBtn" class="primary-btn" onclick="startWebContentStreaming()" disabled>
                Stream
            </button>
            <button id="stopBtn" class="danger-btn" onclick="stopCapture()" disabled>
                Stop
            </button>
        </div>
        
        <!-- Live URL Update Section (shown during streaming) -->
        <div id="liveUpdateSection" class="config-section" style="display: none;">
            <div class="section-title">Live URL Update</div>
            <div class="input-row">
                <div class="input-field">
                    <input type="url" id="liveUrl" placeholder="https://example.com">
                </div>
                <button class="primary-btn" onclick="updateLiveUrl()">
                    Update
                </button>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setLiveUrl('https://example.com')">Example</button>
                <button class="preset-btn" onclick="setLiveUrl('https://httpbin.org')">HTTPBin</button>
                <button class="preset-btn" onclick="setLiveUrl('https://www.ablairneal.com')">Sample</button>
            </div>
        </div>
        
        <!-- Window Controls -->
        <div class="controls-row">
            <button id="toggleDecorationsBtn" class="secondary-btn" onclick="toggleWindowDecorations()">
                TitleBar
            </button>
            <button id="framelessBtn" class="secondary-btn" onclick="toggleFramelessMode()">
                Frame
            </button>
            <button id="showContentTitleBtn" class="secondary-btn" onclick="setContentWindowDecorations(true)" disabled>
                Show
            </button>
            <button id="hideContentTitleBtn" class="secondary-btn" onclick="setContentWindowDecorations(false)" disabled>
                Hide
            </button>
        </div>
        
        <!-- Frame Publishing Controls -->
        <div class="controls-row">
            <button id="processFramesBtn" class="primary-btn" onclick="processFrames()" disabled>
                Process Frames
            </button>
            <button id="startContinuousBtn" class="secondary-btn" onclick="startContinuousProcessing()" disabled>
                Start Auto
            </button>
            <button id="stopContinuousBtn" class="danger-btn" onclick="stopContinuousProcessing()" disabled>
                Stop Auto
            </button>
        </div>
        
        <!-- Content Window Management -->
        <div class="controls-row">
            <button id="closeContentWindowBtn" class="danger-btn" onclick="closeContentWindow()" disabled>
                Close Window
            </button>
            <button id="refreshStateBtn" class="secondary-btn" onclick="refreshApplicationState()">
                Refresh State
            </button>
            <button id="reloadContentBtn" class="secondary-btn" onclick="reloadWebContent()" disabled>
                Reload Content
            </button>
        </div>
        
        <!-- Status -->
        <div class="status">
            <span class="status-indicator status-inactive"></span>
            <span id="statusText">Ready</span>
        </div>
        <div class="status">
            <span id="statsText" class="stats">Frames: 0 | FPS: 0</span>
        </div>
    </div>

    <script>
// Zero-Copy ScreenCaptureKit Frontend for Ultimate Performance
console.log('🚀 Loading Zero-Copy Syphon Frontend...');
const { invoke } = window.__TAURI__.tauri;

// Application state
let isInitialized = false;
let isCapturing = false;
let frameCount = 0;
let captureMode = 'Professional Web Streaming';
let currentStep = 1;

// Performance monitoring
let lastFpsTime = Date.now();
let fpsFrameCount = 0;
let currentFps = 0;
let processingTimer = null;

// Initialize when page loads
document.addEventListener('DOMContentLoaded', () => {
    console.log('🎯 Professional Web Streaming Frontend initialized');
    updateStatus('Ready to configure and stream web content', false);
    updateUI();
    updateWorkflowSteps();
    validateInputs();
});

// Input validation and helpers
function validateInputs() {
    const widthInput = document.getElementById('windowWidth');
    const heightInput = document.getElementById('windowHeight');
    const urlInput = document.getElementById('contentUrl');
    
    [widthInput, heightInput, urlInput].forEach(input => {
        if (input) {
            input.addEventListener('input', updateUI);
        }
    });
}

function setSize(width, height) {
    document.getElementById('windowWidth').value = width;
    document.getElementById('windowHeight').value = height;
    updateUI();
}

function setUrl(url) {
    document.getElementById('contentUrl').value = url;
    updateUI();
}

function updateWorkflowSteps() {
    // Workflow steps removed for compact design
}

// Initialize Syphon server
async function initializeVideoSharing() {
    console.log('🔧 Initializing Syphon server...');
    updateStatus('Initializing Syphon server...', false);
    
    try {
        const response = await invoke('initialize_video_sharing');
        console.log('✅ Syphon server initialized:', response);
        
        isInitialized = true;
        currentStep = 2;
        updateWorkflowSteps();
        updateStatus('✅ Syphon ready', true);
        updateUI();
        
    } catch (error) {
        console.error('❌ Failed to initialize Syphon server:', error);
        updateStatus(`Error: ${error}`, false);
    }
}


// Start performance monitoring (background thread handles the actual publishing)
function startPerformanceMonitoring() {
    if (processingTimer) {
        clearInterval(processingTimer);
    }
    
    console.log('📊 Starting performance monitoring...');
    
    // Monitor performance stats every 500ms (less frequent since capture is automatic)
    processingTimer = setInterval(async () => {
        if (!isCapturing) {
            stopPerformanceMonitoring();
            return;
        }
        
        try {
            const response = await invoke('get_video_status');
            
            if (response.success && response.frame_count > frameCount) {
                frameCount = response.frame_count;
                updatePerformanceStats();
            }
            
        } catch (error) {
            console.error('❌ Performance monitoring error:', error);
            // Don't stop on single errors, just log them
        }
    }, 500); // Monitor every 500ms
}

// Stop performance monitoring
function stopPerformanceMonitoring() {
    if (processingTimer) {
        clearInterval(processingTimer);
        processingTimer = null;
        console.log('📊 Performance monitoring stopped');
    }
}

// Stop capture
async function stopCapture() {
    console.log('🛑 Stopping streaming...');
    updateStatus('Stopping streaming...', false);
    
    try {
        const response = await invoke('stop_screen_capture');
        console.log('✅ Streaming stopped:', response);
        
        isCapturing = false;
        captureMode = 'Professional Web Streaming';
        currentStep = 2; // Back to step 2
        updateWorkflowSteps();
        updateStatus('Stopped - ready for new content', false);
        updateUI();
        
        stopPerformanceMonitoring();
        
    } catch (error) {
        console.error('❌ Failed to stop streaming:', error);
        updateStatus(`Stop error: ${error}`, false);
    }
}


// Create content window with custom size and URL
async function createContentWindow() {
    if (!isInitialized) {
        updateStatus('Please initialize Syphon server first', false);
        return;
    }

    // Get configuration values
    const width = parseInt(document.getElementById('windowWidth').value) || 1920;
    const height = parseInt(document.getElementById('windowHeight').value) || 1080;
    const url = document.getElementById('contentUrl').value || 'https://example.com';
    
    // Validate URL
    if (!url.startsWith('https://')) {
        updateStatus('⚠️ URL must start with https://', false);
        return;
    }
    
    console.log(`🌐 Creating content window: ${width}x${height} → ${url}`);
    updateStatus(`Creating ${width}x${height} content window...`, false);
    
    try {
        const response = await invoke('create_content_window_dynamic', {
            width: width,
            height: height,
            url: url
        });
        console.log('🌐 Content window response:', response);
        
        if (response.success) {
            // Step 2: Update the content window URL
            console.log(`🔄 Setting content URL: ${url}`);
            
            // Add a small delay to ensure the content window is fully loaded
            setTimeout(async () => {
                const urlResponse = await invoke('update_content_url', { url: url });
                console.log('📡 URL update response:', urlResponse);
                
                if (urlResponse.success) {
                    currentStep = 3;
                    updateWorkflowSteps();
                    updateStatus(`✅ Window ${width}×${height} ready`, true);
                    updateUI();
                    
                    console.log('🎉 Content window SUCCESS: Ready for Syphon capture');
                } else {
                    updateStatus(`⚠️ Failed to set URL: ${urlResponse.message}`, false);
                    console.error('❌ URL update failed:', urlResponse.message);
                }
            }, 1000); // Wait 1 second for content window to fully initialize
        } else {
            updateStatus(`⚠️ Failed to create content window: ${response.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Content window creation failed:', error);
        updateStatus(`Content window error: ${error}`, false);
    }
}

// Start Syphon capture of the content window
async function startWebContentStreaming() {
    if (!isInitialized) {
        updateStatus('Please initialize Syphon server first', false);
        return;
    }

    const url = document.getElementById('contentUrl').value;
    console.log(`🎯 Starting web content streaming: ${url}`);
    updateStatus('Starting Syphon capture of content window...', false);
    
    try {
        // Start content window specific streaming
        const captureResponse = await invoke('start_content_window_streaming');
        console.log('🎯 Content window streaming response:', captureResponse);
        
        if (captureResponse.success) {
            // Update capture state
            isCapturing = true;
            captureMode = 'Professional Web Content Streaming';
            updateStatus(`✅ Streaming ${url.split('://')[1]?.split('/')[0]}`, true);
            updateUI();
            
            // Monitor performance
            startPerformanceMonitoring();
            
            console.log('🎉 STREAMING SUCCESS: Web content is now live via Syphon!');
            
        } else {
            updateStatus(`⚠️ Streaming failed: ${captureResponse.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Web content streaming failed:', error);
        updateStatus(`Streaming error: ${error}`, false);
    }
}

// Update performance statistics
function updatePerformanceStats() {
    const now = Date.now();
    fpsFrameCount++;
    
    if (now - lastFpsTime >= 1000) { // Update FPS every second
        currentFps = Math.round(fpsFrameCount * 1000 / (now - lastFpsTime));
        fpsFrameCount = 0;
        lastFpsTime = now;
        
        const statsText = document.getElementById('statsText');
        if (statsText) {
            statsText.textContent = `Frames: ${frameCount} | FPS: ${currentFps} | Mode: ${captureMode}`;
        }
    }
}

// Update UI button states
function updateUI() {
    const initBtn = document.getElementById('initBtn');
    const createContentWindowBtn = document.getElementById('createContentWindowBtn');
    const startStreamingBtn = document.getElementById('startStreamingBtn');
    const stopBtn = document.getElementById('stopBtn');
    const showContentTitleBtn = document.getElementById('showContentTitleBtn');
    const hideContentTitleBtn = document.getElementById('hideContentTitleBtn');
    const liveUpdateSection = document.getElementById('liveUpdateSection');
    const closeContentWindowBtn = document.getElementById('closeContentWindowBtn');
    const refreshStateBtn = document.getElementById('refreshStateBtn');
    const reloadContentBtn = document.getElementById('reloadContentBtn');
    
    // New frame processing controls
    const processFramesBtn = document.getElementById('processFramesBtn');
    const startContinuousBtn = document.getElementById('startContinuousBtn');
    const stopContinuousBtn = document.getElementById('stopContinuousBtn');
    
    // Validate inputs
    const width = parseInt(document.getElementById('windowWidth').value);
    const height = parseInt(document.getElementById('windowHeight').value);
    const url = document.getElementById('contentUrl').value;
    const validInputs = width >= 800 && width <= 3840 && height >= 600 && height <= 2160 && url.startsWith('https://');
    
    // Content window exists when we're at step 3 or currently streaming
    const contentWindowExists = currentStep >= 3 || isCapturing;
    
    if (initBtn) initBtn.disabled = isInitialized;
    if (createContentWindowBtn) createContentWindowBtn.disabled = !isInitialized || !validInputs || isCapturing;
    if (startStreamingBtn) startStreamingBtn.disabled = !isInitialized || isCapturing || currentStep < 3;
    if (stopBtn) stopBtn.disabled = !isCapturing;
    
    // Frame processing controls - enabled when capture is active
    if (processFramesBtn) processFramesBtn.disabled = !isCapturing;
    if (startContinuousBtn) startContinuousBtn.disabled = !isCapturing || continuousProcessing;
    if (stopContinuousBtn) stopContinuousBtn.disabled = !continuousProcessing;
    
    // Content window controls - enabled when content window exists
    if (showContentTitleBtn) showContentTitleBtn.disabled = !contentWindowExists;
    if (hideContentTitleBtn) hideContentTitleBtn.disabled = !contentWindowExists;
    if (closeContentWindowBtn) closeContentWindowBtn.disabled = !contentWindowExists;
    if (reloadContentBtn) reloadContentBtn.disabled = !contentWindowExists;
    
    // Show/hide live URL update section
    if (liveUpdateSection) {
        liveUpdateSection.style.display = isCapturing ? 'block' : 'none';
    }
    
    // Update button text based on state
    if (createContentWindowBtn && !createContentWindowBtn.disabled) {
        const width = document.getElementById('windowWidth').value;
        const height = document.getElementById('windowHeight').value;
        createContentWindowBtn.innerHTML = `🌐 2. Create ${width}×${height} Window`;
    }
}

// Update status display
function updateStatus(message, active) {
    const indicator = document.querySelector('.status-indicator');
    const statusText = document.getElementById('statusText');
    
    if (indicator) {
        indicator.className = `status-indicator ${active ? 'status-active' : 'status-inactive'}`;
    }
    
    if (statusText) {
        statusText.textContent = message;
    }
    
    console.log(`Status: ${message} (${active ? 'active' : 'inactive'})`);
}

// Toggle window decorations (title bar)
async function toggleWindowDecorations() {
    console.log('🎨 Toggling window decorations...');
    updateStatus('Toggling window title bar...', false);
    
    try {
        const response = await invoke('toggle_window_decorations');
        console.log('🎨 Toggle decorations response:', response);
        
        if (response.success) {
            updateStatus(`✅ ${response.message}`, true);
        } else {
            updateStatus(`⚠️ ${response.message}`, false);
        }
    } catch (error) {
        console.error('Toggle decorations error:', error);
        updateStatus(`❌ Failed to toggle decorations: ${error}`, false);
    }
}

// Track frameless state
let isFrameless = false;

// Toggle frameless mode
async function toggleFramelessMode() {
    console.log('🖼️ Toggling frameless mode...');
    updateStatus(`Setting ${isFrameless ? 'normal' : 'frameless'} mode...`, false);
    
    try {
        const response = await invoke('set_frameless_mode', { frameless: !isFrameless });
        console.log('🖼️ Frameless mode response:', response);
        
        if (response.success) {
            isFrameless = !isFrameless;
            updateStatus(`✅ ${response.message}`, true);
            
            // Update button text
            const framelessBtn = document.getElementById('framelessBtn');
            framelessBtn.innerHTML = isFrameless ? '🖼️ Exit Frameless Mode' : '🖼️ Toggle Frameless Mode';
        } else {
            updateStatus(`⚠️ ${response.message}`, false);
        }
    } catch (error) {
        console.error('Frameless mode error:', error);
        updateStatus(`❌ Failed to set frameless mode: ${error}`, false);
    }
}

// Content window decoration controls
async function setContentWindowDecorations(showDecorations) {
    console.log(`🎨 Setting content window decorations: ${showDecorations}`);
    updateStatus(`${showDecorations ? 'Showing' : 'Hiding'} content window title bar...`, false);
    
    try {
        const response = await invoke('set_content_window_decorations', { 
            showDecorations: showDecorations 
        });
        console.log('🎨 Content window decorations response:', response);
        
        if (response.success) {
            updateStatus(`✅ ${response.message}`, true);
        } else {
            updateStatus(`⚠️ ${response.message}`, false);
        }
    } catch (error) {
        console.error('Content window decorations error:', error);
        updateStatus(`❌ Failed to set content window decorations: ${error}`, false);
    }
}

// Live URL update functionality
function setLiveUrl(url) {
    document.getElementById('liveUrl').value = url;
}

async function updateLiveUrl() {
    const url = document.getElementById('liveUrl').value;
    
    if (!url) {
        updateStatus('⚠️ Please enter a URL', false);
        return;
    }
    
    if (!url.startsWith('https://')) {
        updateStatus('⚠️ URL must start with https://', false);
        return;
    }
    
    console.log(`🔄 Updating live URL to: ${url}`);
    updateStatus('Updating content window URL...', false);
    
    try {
        const response = await invoke('update_content_url', { url: url });
        console.log('🔄 Live URL update response:', response);
        
        if (response.success) {
            updateStatus(`✅ URL updated to ${url.split('://')[1]?.split('/')[0] || 'new site'}`, true);
        } else {
            updateStatus(`⚠️ Failed to update URL: ${response.message}`, false);
        }
    } catch (error) {
        console.error('❌ Live URL update failed:', error);
        updateStatus(`❌ Failed to update URL: ${error}`, false);
    }
}

// NEW: Close content window with proper cleanup
async function closeContentWindow() {
    console.log('🔒 Closing content window...');
    updateStatus('Closing content window...', false);
    
    try {
        // First stop any active streaming
        if (isCapturing) {
            await stopCapture();
        }
        
        // Close the content window
        const response = await invoke('close_content_window');
        console.log('🔒 Close content window response:', response);
        
        if (response.success) {
            // Reset state to step 2 (after initialization)
            currentStep = 2;
            updateWorkflowSteps();
            updateStatus('✅ Content window closed', true);
            updateUI();
            
            console.log('🔒 Content window closed successfully');
        } else {
            updateStatus(`⚠️ Failed to close content window: ${response.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Close content window failed:', error);
        updateStatus(`❌ Failed to close content window: ${error}`, false);
    }
}

// NEW: Refresh application state to sync frontend with backend
async function refreshApplicationState() {
    console.log('🔄 Refreshing application state...');
    updateStatus('Refreshing application state...', false);
    
    try {
        const response = await invoke('get_application_state');
        console.log('🔄 Application state response:', response);
        
        if (response.success) {
            // Update frontend state based on backend state
            isInitialized = response.state.initialized || false;
            isCapturing = response.state.capturing || false;
            
            // Determine current step based on state
            if (!isInitialized) {
                currentStep = 1;
            } else if (!response.state.content_window_exists) {
                currentStep = 2;
            } else if (!isCapturing) {
                currentStep = 3;
            } else {
                currentStep = 4;
            }
            
            updateWorkflowSteps();
            updateStatus('✅ Application state refreshed', true);
            updateUI();
            
            // Update performance monitoring if capturing
            if (isCapturing && !processingTimer) {
                startPerformanceMonitoring();
            } else if (!isCapturing && processingTimer) {
                stopPerformanceMonitoring();
            }
            
            console.log('🔄 Application state synchronized');
        } else {
            updateStatus(`⚠️ Failed to refresh state: ${response.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Refresh application state failed:', error);
        updateStatus(`❌ Failed to refresh state: ${error}`, false);
    }
}

// NEW: Reload web content in existing content window
async function reloadWebContent() {
    console.log('🔄 Reloading web content...');
    updateStatus('Reloading web content...', false);
    
    try {
        const response = await invoke('reload_content_window');
        console.log('🔄 Reload content response:', response);
        
        if (response.success) {
            updateStatus('✅ Web content reloaded', true);
            console.log('🔄 Web content reloaded successfully');
        } else {
            updateStatus(`⚠️ Failed to reload content: ${response.message}`, false);
        }
        
    } catch (error) {
        console.error('❌ Reload web content failed:', error);
        updateStatus(`❌ Failed to reload content: ${error}`, false);
    }
}

// NEW: Process captured frames manually (publish to Syphon)
async function processFrames() {
    console.log('🎬 Processing captured frames...');
    
    try {
        const response = await invoke('process_frames');
        console.log('🎬 Process frames response:', response);
        
        if (response.success) {
            frameCount = response.frame_count;
            updatePerformanceStats();
            console.log(`✅ Processed frames: ${response.message}`);
        } else {
            console.log(`⚠️ Process frames: ${response.message}`);
        }
        
    } catch (error) {
        console.error('❌ Process frames failed:', error);
        updateStatus(`❌ Failed to process frames: ${error}`, false);
    }
}

// Continuous processing state
let continuousProcessing = false;
let continuousTimer = null;

// NEW: Start continuous frame processing (replaces background thread)
async function startContinuousProcessing() {
    console.log('🎬 Starting continuous frame processing...');
    updateStatus('Starting continuous frame processing...', false);
    
    if (continuousProcessing) {
        console.log('⚠️ Continuous processing already active');
        return;
    }
    
    continuousProcessing = true;
    
    // Process frames at ~30 FPS (33ms intervals)
    continuousTimer = setInterval(async () => {
        if (!continuousProcessing) {
            return;
        }
        
        try {
            await processFrames();
        } catch (error) {
            console.error('❌ Continuous processing error:', error);
            // Don't stop on single errors, just log them
        }
    }, 33); // ~30 FPS
    
    updateStatus('✅ Continuous frame processing active', true);
    updateUI();
    console.log('🎬 Continuous frame processing started');
}

// NEW: Stop continuous frame processing
async function stopContinuousProcessing() {
    console.log('🛑 Stopping continuous frame processing...');
    updateStatus('Stopping continuous frame processing...', false);
    
    continuousProcessing = false;
    
    if (continuousTimer) {
        clearInterval(continuousTimer);
        continuousTimer = null;
    }
    
    updateStatus('🛑 Continuous frame processing stopped', false);
    updateUI();
    console.log('🛑 Continuous frame processing stopped');
}
